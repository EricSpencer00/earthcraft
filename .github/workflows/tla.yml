name: TLA+ models

on:
  push:
    paths: ['specs/**', '.github/workflows/tla.yml']
  pull_request:
    paths: ['specs/**', '.github/workflows/tla.yml']

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TLA_VERSION: v1.7.4
      TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download tla2tools.jar (pinned sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: Model-check (fixed designs pass, old algorithms stay refuted)
        run: specs/run_tlc.sh "$RUNNER_TEMP/tla2tools.jar"
