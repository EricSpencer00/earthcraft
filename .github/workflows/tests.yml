name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run the offline suite
        run: PYTHONPATH=scripts python -m unittest discover -s tests -v

  public-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Reject machine paths and bot attribution
        run: |
          if git log -E --format=%B | grep -Eiq '^Co-authored-by:'; then
            echo "Bot co-author trailers are not allowed in public history"
            exit 1
          fi
          ! git grep -nE '/Users/|/Volumes/|Generated by (Codex|ChatGPT|Claude)' -- \
            '*.py' '*.command' '*.json' '*.yml' '*.yaml' ':!docs/**'
