name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.event.repository.private == false
    # The offline suite covers the real installer too; its exclusive atomic
    # publication primitive is intentionally macOS-only.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run the offline suite
        run: PYTHONPATH=scripts python -m unittest discover -s tests -v

  public-tree:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Reject machine paths and bot attribution
        run: python scripts/public_tree_check.py
