name: Publish Earthcraft progress atlas

on:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - progress/**
      - scripts/progress_snapshot.py
      - scripts/dataset_coverage.py
      - configs/world-frame.json
      - tests/dashboard_browser.mjs
      - tests/pipeline.mjs
      - tests/pipeline_browser.mjs
      - .github/workflows/progress-pages.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04  # Playwright 1.58 has no Chromium for ubuntu-latest (26.04)
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public source
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install projection support
        run: python -m pip install pyproj==3.7.2
      - name: Check the public tree
        run: python scripts/public_tree_check.py
      - name: Build a privacy-safe snapshot
        run: python scripts/progress_snapshot.py --root . --output progress/earth.json
      - name: Assemble the static observatory
        run: |
          mkdir -p site/progress
          cp dashboard/*.html dashboard/*.js dashboard/*.mjs dashboard/*.css dashboard/places.json site/
          cp -R dashboard/assets site/assets
          cp -R dashboard/cache site/cache
          cp progress/earth.json site/progress/earth.json
          python -c 'from pathlib import Path; p=Path("site"); files=list(p.rglob("*")); assert not any(f.is_symlink() for f in files); size=sum(f.stat().st_size for f in files if f.is_file()); assert size <= 20*2**20, "Pages artifact exceeds the 20 MiB bound"; print("Site bytes:", size)'
          touch site/.nojekyll
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install browser check tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2 @axe-core/playwright@4.11.0
          npx playwright install --with-deps chromium
      - name: Verify the assembled site before publication
        run: |
          node tests/location_search.mjs
          node tests/cell_browser.mjs
          node tests/anvil.mjs
          node tests/frame.mjs
          node tests/lake.mjs
          node tests/fresh-tiles.mjs
          node tests/view_cache.mjs
          node tests/dashboard_browser.mjs site
          node tests/blocks_browser.mjs site
          node tests/pipeline.mjs
          node tests/pipeline_browser.mjs site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
