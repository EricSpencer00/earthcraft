name: Headless block evidence

on:
  push:
    paths:
      - scripts/headless_blocks.py
      - scripts/headless_site.py
      - tests/test_headless_blocks.py
      - progress/headless/**
      - requirements-headless.txt
      - .github/workflows/headless-evidence.yml
  pull_request:
    paths:
      - scripts/headless_blocks.py
      - scripts/headless_site.py
      - tests/test_headless_blocks.py
      - progress/headless/**
      - requirements-headless.txt
      - .github/workflows/headless-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned headless dependencies
        run: python -m pip install -r requirements-headless.txt
      - name: Decode fixtures and verify committed evidence
        run: |
          python -m unittest discover -s tests -p 'test_headless_blocks.py' -v
          python scripts/headless_blocks.py validate --directory progress/headless
          python scripts/headless_site.py --bundle progress/headless --output headless-preview
          python scripts/public_tree_check.py
      - name: Record the evidence preview
        env:
          EVIDENCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('progress/headless/report.json').read_text())
          total=sum(t['actual_non_air_blocks'] for t in r['tiles'])
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write(f"Validated {r['source']['audited_tiles']} tiles, {r['source']['actual_chunks']:,} chunks, {total:,} actual non-air blocks.\n\n")
              f.write(f"[Image at this commit](https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['EVIDENCE_COMMIT']}/progress/headless/blocks.png) · [Live evidence page](https://ericspencer.us/earthcraft/headless/)\n\n")
              f.write('Datum, independent survey accuracy, measured color and game visual acceptance remain unresolved. No Minecraft or model inference used.\n')
          PY
