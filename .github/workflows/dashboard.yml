name: Atlas browser checks

on:
  push:
    paths:
      - dashboard/**
      - tests/dashboard_browser.mjs
      - tests/blocks_browser.mjs
      - tests/pipeline.mjs
      - tests/pipeline_browser.mjs
      - tests/anvil.mjs
      - tests/view_cache.mjs
      - scripts/build_view_cache.mjs
      - tests/range_server.mjs
      - tests/fixtures/anvil/**
      - .github/workflows/dashboard.yml
      - progress/earth.json
      - docs/photos/watertower-sep-10-26.png
  pull_request:
    paths:
      - dashboard/**
      - tests/dashboard_browser.mjs
      - tests/blocks_browser.mjs
      - tests/pipeline.mjs
      - tests/pipeline_browser.mjs
      - tests/anvil.mjs
      - tests/view_cache.mjs
      - scripts/build_view_cache.mjs
      - tests/range_server.mjs
      - tests/fixtures/anvil/**
      - .github/workflows/dashboard.yml
      - progress/earth.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04  # Playwright 1.58 has no Chromium for ubuntu-latest (26.04)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install browser check tools
        run: npm install --no-save --package-lock=false @playwright/test@1.58.2 @axe-core/playwright@4.11.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the atlas and capture each layout
        run: |
          node tests/anvil.mjs
          node tests/frame.mjs
          node tests/lake.mjs
          node tests/fresh-tiles.mjs
          node tests/view_cache.mjs
          node tests/dashboard_browser.mjs
          node tests/blocks_browser.mjs
          node tests/pipeline.mjs
          node tests/pipeline_browser.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: atlas-browser-proof
          path: test-results/
          retention-days: 1
